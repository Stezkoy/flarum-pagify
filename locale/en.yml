stezkoy-pagify:
  admin:
    settings:
      discussion_list_heading: Discussion List
      enableDiscussionList: Paginate the discussion list
      enableDiscussionList-Help: Replace the "Load More" button with numbered page pagination on the index page.
      perPage: Discussions per page
      perPage-Help: How many discussions to show per page. Also controls the page size when pagination is off ("Load more" batches).
      paginationPosition: Pager position

      post_stream_heading: Post Stream
      enablePostStream: Paginate posts inside a discussion
      enablePostStream-Help: Replace infinite scrolling with numbered pages inside each discussion.
      postsPerPage: Posts per page
      postsPerPage-Help: How many posts to show on each page. Applies only when "Paginate posts inside a discussion" is enabled.
      postStreamPosition: Post pager position

      post_list_heading: User Post Feed
      enablePostList: Paginate the user post feed
      enablePostList-Help: Replace the "Load More" button with numbered pages on the user activity feed and the posts page.
      postListPerPage: Posts per page
      postListPerPage-Help: How many posts to show on each page of the feed. Works with pagination off too — it sizes each "Load more" batch.
      postListPosition: Pager position

      position:
        above: Above
        under: Below
        both: Both (top and bottom)

  forum:
    list:
      first: First page
      previous: Previous page
      next: Next page
      last: Last page
      jump: Jump to page
    post_stream:
      aria_label: Post pages
      first: First page
      previous: Previous page
      next: Next page
      last: Last page
