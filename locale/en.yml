stezkoy-pagify:
  admin:
    settings:
      discussion_list_heading: Discussion List
      enableDiscussionList: Paginate the discussion list
      enableDiscussionList-Help: Numbered pages on the index page instead of the "Load More" button.
      perPage: Discussions per page
      perPage-Help: How many discussions to show per page. Without pagination it sizes each "Load More" batch.
      paginationPosition: Pager position

      post_stream_heading: Post Stream
      enablePostStream: Paginate posts inside a discussion
      enablePostStream-Help: Numbered pages inside a discussion instead of infinite scrolling.
      postsPerPage: Posts per page
      postsPerPage-Help: How many posts to show per discussion page. Works only when post pagination is enabled.
      postStreamPosition: Post pager position

      post_list_heading: User Post Feed
      enablePostList: Paginate the user post feed
      enablePostList-Help: Numbered pages instead of the "Load More" button on the user profile feed and the posts page.
      postListPerPage: Posts per page
      postListPerPage-Help: How many posts to show per feed page. Without pagination it sizes each "Load More" batch.
      postListPosition: Pager position

      pager_heading: Pager
      pagerMode: Mode
      pagerMode-Help: Full shows page numbers with a jump field, compact trims the numbers, mini shows only arrows and the current position.
      pager_mode_full: Full
      pager_mode_compact: Compact
      pager_mode_mini: Mini
      pagerWindow: Pages around the current one
      pagerWindow-Help: How many page numbers to show on each side of the current page.
      pagerCounter: Show "Page X of Y"
      pagerCounter-Help: Display the current page and the total under the pager.
      pagerJump: Jump-to-page field
      pagerJump-Help: Show the page-number input next to the pager (full mode only).
      pagerPreview: Preview

      position:
        above: Above
        under: Below
        both: Both (top and bottom)

  forum:
    list:
      first: First page
      previous: Previous page
      next: Next page
      last: Last page
      jump: Jump to page
      pageOf: Page {page} of {total}
    post_stream:
      aria_label: Post pages
      first: First page
      previous: Previous page
      next: Next page
      last: Last page
